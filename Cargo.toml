[package]
name = "nu_plugin_bigquery"
version = "0.3.0"
edition = "2024"
description = "A Nushell plugin for querying Google BigQuery"
license = "MIT"
homepage = "https://github.com/galuszkak/nu_plugin_bigquery/"
repository = "https://github.com/galuszkak/nu_plugin_bigquery/"
authors = ["Kamil Gałuszka"]

[[bin]]
name = "nu_plugin_bigquery"
path = "src/main.rs"

[dependencies]
nu-plugin = "0.114.1"
nu-protocol = "0.114.1"
reqwest = { version = "0.13", features = ["json", "query"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Base64 for BYTES type
base64 = "0.23"

# Arrow IPC output (--arrow flag)
arrow = { version = "59", features = ["ipc"] }
tempfile = "3"

interprocess = "2.4.3"
google-cloud-auth = "1.15.0"
tonic = { version = "0.14.6", features = ["tls-webpki-roots"] }
prost = "0.14.4"
googleapis-tonic-google-cloud-bigquery-storage-v1 = "0.34.0"
